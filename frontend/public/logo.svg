<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark Rounded Background (Squircle) -->
  <rect width="512" height="512" rx="128" fill="#09090B" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#27272A" stroke-width="24" />
  
  <!-- The symmetrical 'v' -->
  <path 
    d="M 156 151 L 256 291 L 356 151" 
    stroke="#10B981" 
    stroke-width="48" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none" 
  />
  
  <!-- The centered terminal cursor '_' -->
  <path 
    d="M 186 361 L 326 361" 
    stroke="#10B981" 
    stroke-width="48" 
    stroke-linecap="round" 
    fill="none" 
  />
</svg>